<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LESOWN Dashboard</title>
<style>
  :root {
    /* 월별 테마 색은 JS가 덮어쓴다 (기본: 가을) */
    --accent: #f4a259; --accent2: #e76f51;
    --text: #ffffff; --muted: rgba(255, 255, 255, .80); --line: rgba(255, 255, 255, .16);
    --glass: rgba(24, 16, 10, .50); --glass-strong: rgba(24, 16, 10, .58);
    --ok: #9ad37b; --warn: #f6c453; --bad: #ef7b6b;
  }
  @font-face { font-family: "SCDream"; src: url("fonts/S-CoreDream-3Light.woff") format("woff"); font-weight: 100 300; }
  @font-face { font-family: "SCDream"; src: url("fonts/S-CoreDream-4Regular.woff") format("woff"); font-weight: 400; }
  @font-face { font-family: "SCDream"; src: url("fonts/S-CoreDream-5Medium.woff") format("woff"); font-weight: 500 900; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--text);
    font-family: "SCDream", "Malgun Gothic", sans-serif; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 440px; overflow: hidden; background: #1a120c; transform-origin: 0 0; }
  /* 세로 모드 (440×1920): 패널을 위에서 아래로 */
  body.portrait #stage { width: 440px; height: 1920px; }
  body.portrait #root { flex-direction: column; height: 1920px; }
  body.portrait #clock { padding: 24px 16px 10px; --w: 420; }
  body.portrait #tt { --w: 640; }
  body.portrait #ttList { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  body.portrait #bg::after { background: linear-gradient(180deg, rgba(0,0,0,.45), rgba(0,0,0,.15) 40%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.45)); }
  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: opacity 1.2s; }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.15) 40%, rgba(0,0,0,.15) 60%, rgba(0,0,0,.45)); }
  #root { position: relative; display: flex; height: 440px; padding: 14px; gap: 14px; }
  #root > .panel { flex: var(--w, 1) 1 0; container-type: inline-size; }
  #clock { --w: 330; } #weather { --w: 380; } #tt { --w: 580; } #eventsPanel { --w: 340; } #msg { --w: 300; } #pc { --w: 248; }
  #root > .panel.off { display: none; }
  /* 우상단 고정 버튼 (설정·종료) */
  #topbar { position: absolute; bottom: 8px; right: 8px; z-index: 6; display: flex; gap: 4px; }
  #topbar button { all: unset; cursor: pointer; width: 34px; height: 34px; text-align: center; line-height: 34px; border-radius: 10px;
    font-size: 17px; color: var(--text); background: rgba(0,0,0,.45); opacity: .5; }
  #topbar button:hover { opacity: 1; background: rgba(0,0,0,.6); }
  #topbar #closeBtn:hover { color: var(--bad); }
  body.detail #topbar { display: none; }
  /* 시계 아래 PC 한 줄 */
  #pcMini { flex: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 15px; color: var(--muted); display: flex; gap: 12px;
    white-space: nowrap; overflow: hidden; cursor: pointer; font-variant-numeric: tabular-nums; }
  #pcMini b { color: var(--text); font-weight: 500; }
  /* 메시지 패널 */
  #msgList { flex: 1; min-height: 0; overflow: hidden; }
  .mi { padding: 8px 0 8px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .mi.read { opacity: .6; }
  .mi.unread::before { content: ''; position: absolute; left: 0; top: 16px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .mi .h { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .mi .h b { color: var(--accent); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; margin-right: 8px; }
  .mi .h span { flex: none; }
  .mi .b { font-size: 18px; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .badge { background: var(--accent); color: #1a120c; border-radius: 999px; padding: 1px 9px; font-size: 14px; font-weight: 600; }
  .badge.zero { background: rgba(255,255,255,.14); color: var(--muted); }
  #msgEmpty { color: var(--muted); font-size: 15px; line-height: 1.6; }
  .panel { background: var(--glass); backdrop-filter: blur(14px) saturate(120%); -webkit-backdrop-filter: blur(14px) saturate(120%);
    border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px; overflow: hidden; box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 10px 32px rgba(0,0,0,.28);
    display: flex; flex-direction: column; min-width: 0; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
  .ptitle { font-size: 17px; color: var(--muted); letter-spacing: .08em; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; }
  .ptitle > :first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  .ptitle > :last-child { flex: none; }
  .ptitle .k { text-transform: uppercase; color: var(--text); font-weight: 500; padding-left: 10px; position: relative; }
  .ptitle .k::before { content: ''; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--accent); }
  .err { color: var(--warn); font-size: 18px; line-height: 1.5; }
  .muted { color: var(--muted); }

  /* 시계 — 패널 없이 배경 위에 */
  #clock { background: none; border: 0; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    justify-content: flex-start; padding-left: 10px; padding-top: 10px; text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  #ampm { font-size: 22px; color: var(--accent); font-weight: 500; letter-spacing: .12em; margin: 4px 0 2px 4px; }
  #time { font-size: 112px; font-weight: 400; line-height: .95; letter-spacing: -1px; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 3px 24px rgba(0,0,0,.75), 0 1px 2px rgba(0,0,0,.6); }
  #time span { font-size: 30px; font-weight: 400; color: var(--accent); margin-left: 8px; letter-spacing: 0; }
  #dayBar { margin-top: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; width: 86%; margin-left: auto; }
  #dayBar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #fff3); transition: width 1s linear; }
  #dayTxt { font-size: 15px; color: var(--muted); margin-top: 5px; text-align: right; }
  #date { font-size: 30px; margin-top: 12px; font-weight: 500; text-align: right; }

  /* 날씨 */
  .wnow { display: flex; align-items: center; gap: 14px; }
  .wicon { font-size: 74px; line-height: 1; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3)); }
  .wtemp { font-size: 76px; font-weight: 300; letter-spacing: -2px; }
  .wdesc { font-size: 18px; color: var(--muted); line-height: 1.6; white-space: nowrap; }
  .wdesc b { color: var(--text); font-weight: 600; font-size: 23px; }
  .wmeta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0 6px; }
  .wmeta div { background: rgba(255,255,255,.06); border-radius: 10px; padding: 6px 4px; text-align: center; font-size: 15px; color: var(--muted); }
  .wmeta b { display: block; color: var(--text); font-size: 19px; font-weight: 600; margin-top: 2px; }
  .hourly { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; font-size: 17px; color: var(--muted);
    padding: 8px 0 10px; border-top: 1px solid var(--line); row-gap: 2px; }
  .hourly .i { font-size: 25px; margin: 3px 0; }
  .hourly .t { color: var(--text); font-size: 19px; }
  .hourly .pb { height: 3px; margin: 6px 10px 0; border-radius: 2px; background: rgba(255,255,255,.10); overflow: hidden; }
  .hourly .pb i { display: block; height: 100%; background: #8ac4ff; }
  .sun { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); padding: 6px 2px 0; }
  .sun b { color: var(--text); font-weight: 500; }
  .daily { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-size: 17px; padding-top: 8px; border-top: 1px solid var(--line); }
  .daily .i { font-size: 25px; }
  .hi { color: #ffb38a; } .lo { color: #a9cdf5; } .pp { color: var(--muted); font-size: 14px; }

  /* 시간표 */
  #ttHead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #ttName { font-size: 23px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  #ttNav { display: flex; align-items: center; gap: 2px; }
  #ttNav button { all: unset; cursor: pointer; font-size: 14px; color: var(--muted); width: 30px; height: 30px; text-align: center; line-height: 30px; border-radius: 8px; }
  #ttNav button:hover { background: rgba(255,255,255,.12); color: var(--text); }
  #ttNav button[hidden] { display: none; }
  #ttNav #ttToday { width: auto; padding: 0 10px; font-size: 15px; color: #1a120c; background: var(--accent); font-weight: 500; margin-left: 4px; }
  #ttWeek { font-size: 17px; color: var(--muted); white-space: nowrap; }
  #ttWeek.other { color: var(--accent); }
  #ttDays { margin-left: auto; display: flex; gap: 4px; }
  #ttDays button { all: unset; cursor: pointer; font-size: 17px; width: 32px; height: 30px; text-align: center; line-height: 30px;
    border-radius: 8px; color: var(--muted); }
  #ttDays button.today { color: var(--accent); }
  #ttDays button.sel { background: rgba(255,255,255,.14); color: var(--text); font-weight: 600; }
  #ttList { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; flex: 1; }
  .slot { position: relative; border-radius: 14px; padding: 10px 12px; background: rgba(255,255,255,.05); overflow: hidden;
    border: 1px solid transparent; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
  .slot .no { font-size: 15px; color: var(--muted); display: flex; justify-content: space-between; white-space: nowrap; gap: 6px; }
  .slot .sj { font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot .rm { font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
  .slot.free .sj { color: var(--muted); font-weight: 400; font-size: 22px; }
  .slot.class { background: rgba(255,255,255,.10); }
  .slot.class .sj { color: var(--text); }
  .slot.event { background: rgba(243,216,181,.08); } .slot.event .sj { color: #f3d8b5; } .slot.event .rm { color: var(--accent); }
  .slot.holiday .sj { font-size: 19px; color: #f3b5a5; }
  .slot.duty, .slot.dangyeo, .slot.sub { background: rgba(244,162,89,.16); }
  .slot.absent { background: rgba(239,123,107,.16); } .slot.absent .sj { font-size: 18px; }
  .slot.lunch { background: rgba(255,255,255,.03); }
  .slot.lunch.dutyon { background: rgba(244,162,89,.16); }
  .slot.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(244,162,89,.25); }
  .slot .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); }
  .slot .prog i { display: block; height: 100%; background: var(--accent); }
  .slot.class::before, .slot.sub::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--accent); opacity: .8; }
  .slot.class, .slot.sub { padding-left: 16px; }
  .slot.past { opacity: .62; }
  #ttFoot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ttFoot { margin-top: 10px; font-size: 17px; align-items: center; overflow: hidden; color: var(--muted); display: flex; gap: 12px; min-height: 18px; }
  #ttFoot .live { color: var(--accent); font-weight: 600; }
  #ttPick { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; }
  #ttPick select { font-size: 20px; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.4); color: var(--text); border: 1px solid var(--line); }

  /* 일정 */
  #events { overflow-y: auto; flex: 1; scrollbar-width: none; }
  #events::-webkit-scrollbar { display: none; }
  .day { font-size: 15px; color: var(--accent); margin: 10px 0 2px; font-weight: 600; letter-spacing: .05em; }
  .day:first-child { margin-top: 0; }
  .ev { display: flex; gap: 10px; padding: 6px 0; font-size: 20px; align-items: baseline; }
  .ev + .ev { border-top: 1px solid var(--line); }
  .ev .t { color: var(--muted); font-size: 17px; min-width: 44px; font-variant-numeric: tabular-nums; }
  .ev .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev.now .n { color: var(--accent); font-weight: 600; }
  .ev.past { opacity: .55; }
  .ev.local .n::before { content: '✎ '; color: var(--accent); font-size: 13px; }

  /* PC */
  .ring-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 6px; justify-items: center; }
  .ring { position: relative; width: 100%; max-width: 104px; aspect-ratio: 1 / 1; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; display: block; }
  .ring .v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .v b { font-size: 19px; font-variant-numeric: tabular-nums; }
  .ring .v span { font-size: 13px; color: var(--muted); }
  #pcbody { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .net { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 15px; color: var(--muted); line-height: 1.4; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .net b { color: var(--text); font-weight: 600; }
  /* 시계 아래 오늘 요약 */
  #todayBox { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; text-shadow: none; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .tchip { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-size: 17px; padding: 6px 18px 6px 14px; border-radius: 999px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(8px); border: 1px solid var(--line); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tchip.hl { color: #1a120c; background: var(--accent); border-color: transparent; font-weight: 500; }
  .tchip b { font-weight: 600; }

  /* 미니 달력 */
  #cal { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
  #cal .mh { font-size: 15px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  #cal .g { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 15px; row-gap: 1px; }
  #cal .g span { position: relative; line-height: 21px; color: var(--text); opacity: .85; }
  #cal .g .wk { color: var(--muted); font-size: 14px; }
  #cal .g .sun { color: #f3a5a0; } #cal .g .sat { color: #a9cdf5; }
  #cal .g .out { opacity: .4; }
  #cal .g .td { background: var(--accent); color: #1a120c; border-radius: 6px; font-weight: 600; opacity: 1; }
  #cal .g .has::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }

  /* PC 그래프 */
  .spark { margin-top: 8px; }
  .spark .lbl { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 2px; }
  .spark svg { display: block; width: 100%; height: 28px; }

  /* 설정 */
  #modal { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal.on { display: flex; }
  #modal .box { width: 520px; background: rgba(30,22,16,.92); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  #modal h3 { font-size: 23px; font-weight: 600; margin-bottom: 14px; }
  #modal label { font-size: 17px; color: var(--muted); display: block; margin-bottom: 6px; }
  #modal .chk { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 4px 0 16px; }
  #modal .chk label { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 17px; margin: 0; cursor: pointer; }
  #modal .chk input { width: 20px; height: 20px; accent-color: var(--accent); }
  #modal select { width: 100%; font: inherit; font-size: 20px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.4); color: var(--text); border: 1px solid var(--line); }
  #modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  #modal button { font: inherit; font-size: 18px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text); cursor: pointer; }
  #modal button.pri { background: var(--accent); color: #1a120c; border-color: transparent; font-weight: 600; }
  /* 패널이 좁아지면(모든 패널을 켠 경우 등) 글자·항목 축소 */
  @container (max-width: 430px) {
    .ptitle { font-size: 15px; }
    .wtemp { font-size: 54px; letter-spacing: -1px; } .wicon { font-size: 50px; } .wnow { gap: 10px; }
    .wdesc { font-size: 15px; line-height: 1.5; } .wdesc b { font-size: 18px; }
    .wmeta div { font-size: 13px; padding: 5px 2px; } .wmeta b { font-size: 16px; }
    .hourly { font-size: 14px; } .hourly .t { font-size: 16px; } .hourly .i { font-size: 20px; }
    .daily { font-size: 14px; padding-top: 6px; } .daily .i { font-size: 20px; } .daily .pp { display: none; }
    .hourly { padding: 6px 0 8px; } .hourly .pb { margin-top: 4px; }
    #wupd { font-size: 14px; }
  }
  @container (max-width: 340px) {
    #wupd { display: none; } .wmeta { gap: 4px; } .wmeta div { padding: 4px 1px; font-size: 12px; } .wmeta b { font-size: 15px; }
    .wtemp { font-size: 50px; } .wicon { font-size: 44px; } .wdesc { font-size: 14px; } .wdesc b { font-size: 16px; }
  }
  @container (max-width: 500px) {
    .slot .no small { display: none; } .slot .no { font-size: 13px; }
    .slot .no span { overflow: hidden; text-overflow: ellipsis; }
    .slot .sj { font-size: 23px; } .slot .rm { font-size: 14px; } .slot { padding: 8px 10px; }
    #ttName { font-size: 19px; } #ttWeek { font-size: 15px; } #ttFoot { font-size: 14px; }
    #ttDays button { width: 26px; font-size: 15px; } #ttNav button { width: 24px; }
  }
  @container (max-width: 300px) {
    .ev { font-size: 16px; } .ev .t { font-size: 13px; min-width: 40px; }
    .mi .b { font-size: 16px; } .ring .v b { font-size: 17px; } .ring .v span { font-size: 12px; } .ring-row { gap: 6px 4px; }
    .spark .lbl { font-size: 12px; white-space: nowrap; gap: 6px; } .spark .lbl span { overflow: hidden; text-overflow: ellipsis; }
  }
</style>
<link rel="stylesheet" href="detail.css">
</head>
<body>
<div id="stage">
<div id="bg"></div>
<div id="topbar"><button id="gear" title="설정">⚙</button><button id="closeBtn" title="종료 (Esc)">✕</button></div>
<div id="modal"><div class="box">
  <h3>설정</h3>
  <label>화면 방향</label>
  <div class="chk" id="setOrient">
    <label><input type="radio" name="orient" value="landscape"> 가로 (1920×440)</label>
    <label><input type="radio" name="orient" value="portrait"> 세로 (440×1920)</label>
  </div>
  <label>화면에 표시할 항목</label>
  <div class="chk">
    <label><input type="checkbox" value="weather"> 날씨</label>
    <label><input type="checkbox" value="tt"> 시간표</label>
    <label><input type="checkbox" value="events"> 일정</label>
    <label><input type="checkbox" value="msg"> 쿨메시지</label>
    <label><input type="checkbox" value="pc"> PC 상태</label>
  </div>
  <label for="setTeacher">교사 선택</label>
  <select id="setTeacher"></select>
  <div class="btns"><button id="setReload">시간표 새로고침</button><button id="setCancel">취소</button><button class="pri" id="setSave">저장</button></div>
</div></div>
<div id="detail"><div class="dhead"><button id="dback">← 허브로</button><span id="dtitle"></span><span id="dclock"></span></div><div id="dbody"></div></div>
<div id="root">
  <section class="panel" id="clock">
    <div id="ampm"></div>
    <div id="time">--:--</div>
    <div id="date"></div>
    <div id="todayBox"></div>
    <div id="pcMini" title="PC 상태 자세히"></div>
  </section>

  <section class="panel" id="weather">
    <div class="ptitle"><span class="k" id="wname">날씨</span><span id="wupd"></span></div>
    <div id="wbody"><div class="muted">불러오는 중…</div></div>
  </section>

  <section class="panel" id="tt">
    <div id="ttHead">
      <span id="ttName">시간표</span>
      <div id="ttNav"><button data-wk="-1" title="이전 주">◀</button><span id="ttWeek"></span><button data-wk="1" title="다음 주">▶</button><button id="ttToday" hidden>오늘</button></div>
      <div id="ttDays"></div>
    </div>
    <div id="ttList"><div class="muted" style="grid-column:1/-1;align-self:center;text-align:center">시간표 불러오는 중…</div></div>
    <div id="ttFoot"></div>
  </section>

  <section class="panel" id="eventsPanel">
    <div class="ptitle"><span class="k">일정</span><span id="eupd"></span></div>
    <div id="events"><div class="muted">불러오는 중…</div></div>
    <div id="cal"></div>
  </section>

  <section class="panel" id="msg">
    <div class="ptitle"><span class="k">쿨메시지</span><span id="msgBadge" class="badge zero">0</span></div>
    <div id="msgList"><div id="msgEmpty">불러오는 중…</div></div>
  </section>

  <section class="panel" id="pc">
    <div class="ptitle"><span class="k">PC</span><span></span></div>
    <div id="pcbody"></div>
  </section>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const esc = x => String(x ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- 월별 배경 & 테마 ---------- */
const THEMES = {
  1:  ['한겨울', '#9cc3e6', 'rgba(10,18,30,.50)'],  2:  ['늦겨울', '#e6b8d0', 'rgba(22,16,28,.50)'],
  3:  ['초봄',   '#f2d16b', 'rgba(20,22,14,.32)'],  4:  ['봄',     '#f4a6c1', 'rgba(28,14,22,.30)'],
  5:  ['신록',   '#a8d672', 'rgba(12,22,12,.32)'],  6:  ['초여름', '#f6b860', 'rgba(24,18,10,.50)'],
  7:  ['한여름', '#6fd3cf', 'rgba(8,22,28,.50)'],   8:  ['늦여름', '#8fd694', 'rgba(8,20,14,.50)'],
  9:  ['초가을', '#f2c65c', 'rgba(26,20,8,.50)'],   10: ['가을',   '#f4a259', 'rgba(26,14,8,.32)'],
  11: ['늦가을', '#e0a66b', 'rgba(24,16,10,.50)'],  12: ['겨울밤', '#f2c879', 'rgba(10,14,26,.50)'],
};
let curMonth = 0;
function applyMonth() {
  const m = new Date().getMonth() + 1;
  if (m === curMonth) return;
  curMonth = m;
  const [name, accent, glass] = THEMES[m];
  const r = document.documentElement.style;
  r.setProperty('--accent', accent);
  r.setProperty('--glass', glass);
  $('bg').style.backgroundImage = `url("bg/${pad(m)}.jpg")`;
}

/* ---------- 과목명 축약: 4~6자, 기호로 끝나지 않게 ---------- */
// 예) "시험/학평 (종일)" → "시험/학평", "1차 정기시험 (2,3학년)" → "1차 정기시", "결강 (대강: 홍길동)" → "결강"
const SYM_END = /[^\p{L}\p{N}]+$/u;          // 끝의 기호·공백
const strip = t => t.replace(SYM_END, '');
function shortName(name, min = 4, max = 6) {
  let t = String(name || '').replace(/\s+/g, ' ').trim();
  const fixParen = x => { const o = x.lastIndexOf('('), c = x.lastIndexOf(')'); return o > c ? strip(x.slice(0, o)) : x; };
  if ([...t].length <= max) return fixParen(strip(t)) || t;
  const ch = [...t];
  // 1) min~max 사이에 있는 단어 경계(공백·기호) 중 가장 뒤에서 자르기
  let best = '';
  for (let i = max; i >= min; i--) {
    if (i < ch.length && /[^\p{L}\p{N}]/u.test(ch[i])) { best = fixParen(strip(ch.slice(0, i).join(''))); if ([...best].length >= min) break; best = ''; }
  }
  // 2) 없으면 max 에서 자르고 끝 기호 정리
  if (!best) best = fixParen(strip(ch.slice(0, max).join('')));
  // 3) 그래도 너무 짧으면 min 글자라도 (기호 정리)
  if ([...best].length < 2) best = strip(ch.slice(0, min).join('')) || ch.slice(0, min).join('');
  return best;
}

/* ---------- 시계 ---------- */
const PERIODS = [
  [1, '08:40', '09:30'], [2, '09:40', '10:30'], [3, '10:40', '11:30'], [4, '11:40', '12:30'],
  ['점심', '12:30', '13:30'], [5, '13:30', '14:20'], [6, '14:40', '15:30'], [7, '15:40', '16:30'],
];
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
function tickClock() {
  const d = new Date(), h = d.getHours();
  $('time').innerHTML = `${pad(h % 12 || 12)}:${pad(d.getMinutes())}<span>${pad(d.getSeconds())}</span>`;
  $('ampm').textContent = h < 12 ? '오전' : '오후';
  $('date').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
  applyMonth();
  if (window.tickDetail) tickDetail(d);
}

/* ---------- 날씨 ---------- */
const WMO = {
  0: ['☀️', '맑음'], 1: ['🌤️', '대체로 맑음'], 2: ['⛅', '구름 조금'], 3: ['☁️', '흐림'], 45: ['🌫️', '안개'], 48: ['🌫️', '안개'],
  51: ['🌦️', '이슬비'], 53: ['🌦️', '이슬비'], 55: ['🌦️', '이슬비'], 61: ['🌧️', '비'], 63: ['🌧️', '비'], 65: ['🌧️', '강한 비'],
  66: ['🌧️', '어는 비'], 67: ['🌧️', '어는 비'], 71: ['🌨️', '눈'], 73: ['🌨️', '눈'], 75: ['❄️', '많은 눈'], 77: ['🌨️', '싸락눈'],
  80: ['🌦️', '소나기'], 81: ['🌧️', '소나기'], 82: ['⛈️', '강한 소나기'], 85: ['🌨️', '눈 소나기'], 86: ['🌨️', '눈 소나기'],
  95: ['⛈️', '뇌우'], 96: ['⛈️', '뇌우·우박'], 99: ['⛈️', '뇌우·우박'],
};
const wmo = (c, day = 1) => { const w = WMO[c] || ['❔', '-']; return (!day && c <= 1) ? ['🌙', w[1]] : w; };
const grade = (v, cut) => v == null ? '-' : v <= cut[0] ? '좋음' : v <= cut[1] ? '보통' : v <= cut[2] ? '나쁨' : '매우나쁨';
let weatherData = null, weatherName = '';
async function loadWeather() {
  const d = await pywebview.api.get_weather();
  weatherData = d; if (window.onDataChange) onDataChange('weather');
  if (d.error) { $('wbody').innerHTML = `<div class="err">날씨 오류: ${esc(d.error)}</div>`; return; }
  const c = d.current, [ic, desc] = wmo(c.weather_code, c.is_day), air = d.air || {};
  const nowH = new Date(); nowH.setMinutes(0, 0, 0);
  const idx = d.hourly.time.findIndex(t => new Date(t) >= nowH);
  let hourly = '';
  for (let i = idx + 2; i < idx + 2 + 12 && i < d.hourly.time.length; i += 2) {
    const t = new Date(d.hourly.time[i]), hh = t.getHours();
    hourly += `<div>${hh}시<div class="i">${wmo(d.hourly.weather_code[i], hh >= 6 && hh < 19)[0]}</div>
      <div class="t">${Math.round(d.hourly.temperature_2m[i])}°</div><div class="pb"><i style="width:${d.hourly.precipitation_probability[i] ?? 0}%"></i></div></div>`;
  }
  const daily = d.daily.time.map((t, i) => `<div>${i === 0 ? '오늘' : WD[new Date(t).getDay()]}
      <div class="i">${wmo(d.daily.weather_code[i])[0]}</div>
      <span class="hi">${Math.round(d.daily.temperature_2m_max[i])}°</span> <span class="lo">${Math.round(d.daily.temperature_2m_min[i])}°</span>
      <div class="pp">☔ ${d.daily.precipitation_probability_max[i] ?? 0}%</div></div>`).join('');
  $('wbody').innerHTML = `
    <div class="wnow"><div class="wicon">${ic}</div><div class="wtemp">${Math.round(c.temperature_2m)}°</div>
      <div class="wdesc"><b>${desc}</b><br>체감 ${Math.round(c.apparent_temperature)}°</div></div>
    <div class="wmeta"><div>습도<b>${c.relative_humidity_2m}%</b></div><div>바람<b>${(c.wind_speed_10m / 3.6).toFixed(1)}m/s</b></div>
      <div>미세먼지<b>${grade(air.pm10, [30, 80, 150])}</b></div><div>초미세<b>${grade(air.pm2_5, [15, 35, 75])}</b></div></div>
    <div class="hourly">${hourly}</div><div class="daily">${daily}</div>`;
  $('wupd').textContent = d.daily.sunrise ? `🌅 ${d.daily.sunrise[0].slice(11)} · 🌇 ${d.daily.sunset[0].slice(11)}` : '';
}

/* ---------- 시간표 (사이트 엔진 데이터) ---------- */
let tt = null, ttSel = null, ttSelAt = 0, ttWeekSel = null, ttWeekAt = 0, ttWant = null, ttRetry = 0;   // ttWeekSel: 0-based, null=오늘 주차
async function loadTimetable() {
  if (ttWeekSel != null && Date.now() - ttWeekAt > 3 * 60 * 1000) ttWeekSel = null;   // 3분 뒤 오늘 주차로 복귀
  const r = await pywebview.api.get_timetable(ttWeekSel ?? -1);
  if (!r || !r.ready) {
    if (!tt) { $('ttList').innerHTML = `<div class="muted" style="grid-column:1/-1;align-self:center;text-align:center">${esc(r && r.error ? r.error : '시간표 불러오는 중…')}</div>`; setTimeout(loadTimetable, 3000); }
    return;
  }
  if (!r.teacher) { renderPicker(r.teachers); return; }
  tt = r; teacherList = r.teachers; renderTimetable();
  // 요청한 교사·주차가 아직 반영 안 됐으면(사이트 창이 3초 주기로 밀어줌) 잠시 뒤 다시
  const wantWeek = ttWeekSel ?? (r.currentWeek - 1);
  const mismatch = (r.week - 1 !== wantWeek) || (ttWant && r.teacher !== ttWant);
  if (mismatch && ttRetry < 8) { ttRetry++; setTimeout(loadTimetable, 2000); } else { ttRetry = 0; if (!mismatch) ttWant = null; }
}
let teacherList = [];
function renderPicker(teachers) {
  teacherList = teachers;
  $('ttName').textContent = '시간표';
  $('ttList').innerHTML = `<div id="ttPick" style="grid-column:1/-1;grid-row:1/-1"><div class="muted">교사가 설정되지 않았습니다</div>
    <button class="tchip hl" style="cursor:pointer;border:0;font:inherit" onclick="openSettings()">⚙ 교사 선택</button></div>`;
}
function changeWeek(delta) {
  if (!tt) return;
  const w = Math.max(0, Math.min(tt.totalWeeks - 1, (tt.week - 1) + delta));
  ttWeekSel = w === tt.currentWeek - 1 ? null : w; ttWeekAt = Date.now(); ttRetry = 0;
  loadTimetable();
}
let panelsOn = ['weather', 'tt', 'events', 'msg'];
function applyPanels() {
  ['weather', 'tt', 'eventsPanel', 'msg', 'pc'].forEach(id => $(id).classList.toggle('off', !panelsOn.includes(id === 'eventsPanel' ? 'events' : id)));
  setTimeout(fitAll, 50);
}
function openSettings() {
  const list = (tt && tt.teachers) || teacherList;
  const cur = tt ? tt.teacher : '';
  $('setTeacher').innerHTML = list.map(t => `<option ${t === cur ? 'selected' : ''}>${esc(t)}</option>`).join('');
  $('modal').querySelectorAll('.chk input[type=checkbox]').forEach(i => i.checked = panelsOn.includes(i.value));
  $('modal').querySelectorAll('input[name=orient]').forEach(i => i.checked = (document.body.classList.contains('portrait') ? 'portrait' : 'landscape') === i.value);
  $('modal').classList.add('on');
}
function closeSettings() { $('modal').classList.remove('on'); }
function renderTimetable() {
  if (!tt) return;
  // 다른 요일을 눌러봤다면 60초 뒤 오늘로 복귀
  if (ttSel && Date.now() - ttSelAt > 60000) ttSel = null;
  const day = ttSel || tt.today, data = tt.days[day];
  const isCurWeek = tt.week === tt.currentWeek;
  const isToday = isCurWeek && day === tt.today && WD[new Date().getDay()] === tt.today;
  $('ttName').textContent = tt.teacher;
  $('ttWeek').textContent = `${tt.week}주차`;
  $('ttWeek').className = isCurWeek ? '' : 'other';
  $('ttToday').hidden = isCurWeek;
  $('ttDays').innerHTML = ['월', '화', '수', '목', '금'].map(d =>
    `<button class="${d === day ? 'sel' : ''} ${d === tt.today ? 'today' : ''}" data-d="${d}">${d}</button>`).join('');
  $('ttDays').querySelectorAll('button').forEach(b => b.onclick = () => { ttSel = b.dataset.d; ttSelAt = Date.now(); renderTimetable(); });

  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  const state = (s, e) => !isToday ? '' : nowMin >= toMin(e) ? 'past' : nowMin >= toMin(s) ? 'now' : '';
  let html = '';
  PERIODS.forEach(([p, s, e]) => {
    if (p === '점심') {
      html += `<div class="slot lunch ${data.lunchDuty ? 'dutyon' : ''} ${state(s, e)}"><div class="no"><span>점심<small> · ${s}</small></span></div>
        <div class="sj">${data.lunchDuty ? '🍱 급식지도' : '점심시간'}</div><div class="rm">${data.lunchDuty ? '학생 식당' : ''}</div></div>`;
      return;
    }
    const c = data.periods[p - 1] || { type: 'free', subject: '공강', room: '' };
    const jido = data.jido.find(j => Number(j.period) === p);
    const asDuty = jido && c.type === 'free';
    const st = state(s, e);
    const main = asDuty ? '공강지도' : shortName(c.subject);
    const sub = jido ? shortName(jido.target) : shortName(c.room);
    const prog = st === 'now' ? `<div class="prog"><i style="width:${Math.round((nowMin - toMin(s)) / (toMin(e) - toMin(s)) * 100)}%"></i></div>` : '';
    html += `<div class="slot ${asDuty ? 'duty' : c.type} ${st}"><div class="no"><span>${p}교시<small> · ${s}</small></span></div>
      <div class="sj">${esc(main)}</div><div class="rm">${esc(sub)}</div>${prog}</div>`;
  });
  $('ttList').innerHTML = html;

  const classes = data.periods.filter(c => c.type === 'class' || c.type === 'sub').length;
  let live = '';
  if (isToday) {
    for (const [p, s, e] of PERIODS) {
      if (nowMin >= toMin(s) && nowMin < toMin(e)) { live = `${p === '점심' ? '점심시간' : p + '교시'} · ${toMin(e) - nowMin}분 남음`; break; }
      if (nowMin < toMin(s)) { live = `다음 ${p === '점심' ? '점심' : p + '교시'}까지 ${toMin(s) - nowMin}분`; break; }
    }
  }
  if (window.onDataChange) onDataChange('timetable');
  $('ttFoot').innerHTML = `<span class="live">${live}</span><span>${tt.range}</span>${data.title ? `<span>· ${esc(data.title)}</span>` : `<span>· 수업 ${classes}시간</span>`}`;
  renderTodayBox();
}
function renderTodayBox() {
  if (!tt) return;
  const d = tt.days[tt.today], chips = [];
  const isToday = WD[new Date().getDay()] === tt.today;
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  if (d.title) chips.push(`<span class="tchip hl">📌 ${esc(d.title)}</span>`);
  if (isToday) {
    const next = PERIODS.find(([p, s]) => typeof p === 'number' && toMin(s) > nowMin
      && ['class', 'sub', 'dangyeo'].includes((d.periods[p - 1] || {}).type));
    if (next) { const c = d.periods[next[0] - 1]; chips.push(`<span class="tchip">다음 수업 <b>${next[0]}교시 ${esc(c.subject)}</b> ${esc(c.room)} · ${next[1]}</span>`); }
    else if (nowMin < toMin('16:30')) chips.push(`<span class="tchip">오늘 남은 수업 없음</span>`);
  } else {
    chips.push(`<span class="tchip">${tt.today}요일 시간표 표시 중</span>`);
  }
  d.jido.forEach(j => chips.push(`<span class="tchip">🛡 ${j.period}교시 공강지도 · ${esc(j.target)}</span>`));
  if (d.lunchDuty) chips.push(`<span class="tchip">🍱 점심 급식지도</span>`);
  $('todayBox').innerHTML = chips.slice(0, 3).join('');
}

/* ---------- 일정 ---------- */
let eventsCache = [], eventsErr = null;
async function loadEvents() {
  const r = await pywebview.api.get_events();
  if (r.error && !r.events) { $('events').innerHTML = `<div class="muted" style="font-size:17px;line-height:1.6">${esc(r.error)}</div>`; renderCal(); return; }
  eventsCache = r.events || []; eventsErr = r.error;
  renderEvents();
  const u = new Date(); $('eupd').textContent = `${pad(u.getHours())}:${pad(u.getMinutes())}`;
}
function renderEvents() {
  const now = new Date(), today0 = new Date(now.toDateString());
  if (!eventsCache.length) { $('events').innerHTML = `<div class="muted">예정된 일정이 없습니다.</div>`; renderCal(); return; }
  let html = '', lastDay = '';
  for (const e of eventsCache) {
    const s = new Date(e.start), en = e.end ? new Date(e.end) : s;
    if (en <= today0) continue;
    const key = (s < today0 ? today0 : s).toDateString();
    if (key !== lastDay) {
      const diff = Math.round((new Date(key) - today0) / 864e5), k = new Date(key);
      html += `<div class="day">${diff === 0 ? '오늘' : diff === 1 ? '내일' : `${k.getMonth() + 1}/${k.getDate()} ${WD[k.getDay()]}`}</div>`;
      lastDay = key;
    }
    const cls = e.all_day ? '' : (now >= s && now < en ? 'now' : now >= en ? 'past' : '');
    html += `<div class="ev ${cls} ${e.local ? 'local' : ''}"><span class="t">${e.all_day ? '종일' : `${pad(s.getHours())}:${pad(s.getMinutes())}`}</span>
      <span class="n">${esc(e.title)}</span></div>`;
  }
  if (eventsErr) html += `<div class="err" style="margin-top:8px;font-size:15px">일부 캘린더 오류</div>`;
  $('events').innerHTML = html;
  renderCal();
  if (window.onDataChange) onDataChange('events');
}
function renderCal() {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const has = new Set(eventsCache.map(e => new Date(e.start).toDateString()));
  let g = WD.map((w, i) => `<span class="wk ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</span>`).join('');
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const cls = [d.getMonth() !== m ? 'out' : '', d.getDay() === 0 ? 'sun' : d.getDay() === 6 ? 'sat' : '',
      d.toDateString() === now.toDateString() ? 'td' : '', has.has(d.toDateString()) ? 'has' : ''].join(' ');
    g += `<span class="${cls}">${d.getDate()}</span>`;
  }
  $('cal').innerHTML = `<div class="mh"><span>${y}년 ${m + 1}월</span></div><div class="g">${g}</div>`;
}

/* ---------- PC ---------- */
const ring = (v, label, text) => {
  const R = 38, C = 2 * Math.PI * R, col = v < 60 ? 'var(--accent)' : v < 85 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="ring"><svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="${R}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/>
    <circle cx="43" cy="43" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.min(v, 100) / 100)}" style="transition:stroke-dashoffset .6s"/></svg>
    <div class="v"><b>${text ?? Math.round(v) + '%'}</b><span>${label}</span></div></div>`;
};
const hist = { cpu: [], ram: [], gpu: [], disk: [], net: [] }, HN = 60;
let lastSys = null;
function spark(arr, max, color, Hh = 34) {
  if (arr.length < 2) return '<svg></svg>';
  const W = 200, step = W / (arr.length - 1), off = 0;
  const pts = arr.map((v, i) => `${(off + i * step).toFixed(1)},${(Hh - 2 - Math.min(v / max, 1) * (Hh - 4)).toFixed(1)}`);
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
    <polygon points="${off},${Hh} ${pts.join(' ')} ${W},${Hh}" fill="${color}" opacity=".18"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
const speed = b => b > 1048576 ? (b / 1048576).toFixed(1) + 'MB/s' : (b / 1024).toFixed(0) + 'KB/s';
async function loadSystem() {
  const s = await pywebview.api.get_system();
  let h = '<div class="ring-row">' + ring(s.cpu, 'CPU') + ring(s.ram, 'RAM');
  h += s.gpu ? ring(s.gpu.load, `GPU ${Math.round(s.gpu.temp)}°`) : '';
  h += s.battery != null ? ring(s.battery, '배터리') : ring(s.disk, '디스크');
  h += '</div>';
  lastSys = s;
  hist.cpu.push(s.cpu); hist.ram.push(s.ram); hist.gpu.push(s.gpu ? s.gpu.load : 0); hist.disk.push(s.disk); hist.net.push(s.down + s.up);
  if (hist.cpu.length > HN) for (const k in hist) hist[k].shift();
  const nmax = Math.max(102400, ...hist.net);
  h += `<div class="spark"><div class="lbl"><span>CPU 2분</span><span>${Math.round(s.cpu)}%</span></div>${spark(hist.cpu, 100, 'var(--accent)')}</div>`;
  h += `<div class="spark"><div class="lbl"><span>네트워크</span><span>↓${speed(s.down)} ↑${speed(s.up)}</span></div>${spark(hist.net, nmax, '#a9cdf5')}</div>`;
  const up = s.uptime, ud = Math.floor(up / 86400), uh = Math.floor(up % 86400 / 3600), um = Math.floor(up % 3600 / 60);
  h += `<div class="net"><span>가동 <b>${ud ? ud + '일 ' : ''}${uh}시간 ${um}분</b></span><span>RAM <b>${s.ram_used}/${s.ram_total}GB</b></span></div>`;
  $('pcbody').innerHTML = h;
  $('pcMini').innerHTML = `<span>CPU <b>${Math.round(s.cpu)}%</b></span><span>RAM <b>${Math.round(s.ram)}%</b></span>${s.gpu ? `<span>GPU <b>${s.gpu.load}%</b></span>` : ''}<span>↓<b>${speed(s.down)}</b></span>`;
  if (window.onDataChange) onDataChange('system');
}

/* ---------- 메시지 (쿨메신저 등 알림) ---------- */
let msgData = { count: 0, items: [], source: 'none', error: '' };
const timeAgo = iso => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? '방금' : m < 60 ? `${m}분 전` : m < 1440 ? `${Math.floor(m / 60)}시간 전` : `${Math.floor(m / 1440)}일 전`; };
async function loadMessages() {
  msgData = await pywebview.api.get_messages() || msgData;
  renderMessages();
  if (window.onDataChange) onDataChange('messages');
}
function renderMessages() {
  const b = $('msgBadge'); b.textContent = msgData.count; b.className = 'badge' + (msgData.count ? '' : ' zero');
  if (!msgData.items.length) {
    $('msgList').innerHTML = `<div id="msgEmpty">${msgData.source === 'none'
      ? '새 메시지 없음<br><small>' + esc(msgData.error || '쿨메신저 알림을 기다리는 중') + '</small>' : '수신 쪽지 없음'}</div>`;
    return;
  }
  $('msgList').innerHTML = msgData.items.map(m => `<div class="mi ${m.unread === false ? 'read' : 'unread'}"><div class="h"><b>${esc(m.title || m.app || '메시지')}</b><span>${timeAgo(m.time)}</span></div>
    <div class="b">${esc(m.body || '')}</div></div>`).join('');
}

/* ---------- 넘치는 글자 자동 축소 ---------- */
function fitAll() {
  document.querySelectorAll('#time, .sj, .rm, .ev .n, .tchip, #date, #ttWeek, .wdesc b, .net, .spark .lbl span:last-child, #pcMini, #ttFoot, .ptitle > :first-child').forEach(el => {
    el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize), min = el.classList.contains('rm') ? 13 : fs * 0.6;
    while (el.scrollWidth > el.clientWidth && fs > min) { fs -= 1; el.style.fontSize = fs + 'px'; }
  });
  // 세로 넘침: 목록은 스크롤 대신 아래 항목을 숨김 (허브 일정, 상세 목록)
  document.querySelectorAll('#events, #msgList, .dlist').forEach(ev => {
    [...ev.children].forEach(c => c.style.display = '');
    if (ev.scrollHeight > ev.clientHeight) {
      const kids = [...ev.children];
      for (let i = kids.length - 1; i > 0 && ev.scrollHeight > ev.clientHeight; i--) kids[i].style.display = 'none';
    }
  });
}
if (document.fonts) document.fonts.ready.then(fitAll);
window.addEventListener('resize', fitAll);
new MutationObserver(() => { clearTimeout(window._fitT); window._fitT = setTimeout(fitAll, 50); })
  .observe(document.body, { childList: true, subtree: true });

/* ---------- 무대 맞춤: 창/배율이 달라도 1920×440 디자인을 그대로 축소·확대 ---------- */
let STAGE_W = 1920, STAGE_H = 440;
function setOrientation(o) {
  const portrait = o === 'portrait';
  document.body.classList.toggle('portrait', portrait);
  STAGE_W = portrait ? 440 : 1920; STAGE_H = portrait ? 1920 : 440;
  fitStage(); setTimeout(fitAll, 50);
}
function fitStage() {
  const k = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  const st = $('stage');
  st.style.transform = `scale(${k})`;
  st.style.left = Math.round((innerWidth - STAGE_W * k) / 2) + 'px';
  st.style.top = Math.round((innerHeight - STAGE_H * k) / 2) + 'px';
}
addEventListener('resize', fitStage); fitStage();

/* ---------- 시작 ---------- */
tickClock(); setInterval(tickClock, 1000);
window.addEventListener('pywebviewready', async () => {
  const cfg = await pywebview.api.get_config();
  weatherName = cfg.weather_name; $('wname').textContent = cfg.weather_name;
  if (Array.isArray(cfg.panels)) panelsOn = cfg.panels; applyPanels();
  setOrientation(cfg.orientation || 'landscape');
  $('closeBtn').onclick = () => pywebview.api.close();
  $('gear').onclick = openSettings;
  $('setCancel').onclick = closeSettings;
  $('setReload').onclick = async () => { closeSettings(); await pywebview.api.reload_timetable(); tt = null; ttRetry = 0; setTimeout(loadTimetable, 4000); };
  $('ttNav').querySelectorAll('[data-wk]').forEach(b => b.onclick = () => changeWeek(Number(b.dataset.wk)));
  $('ttToday').onclick = () => { ttWeekSel = null; ttRetry = 0; loadTimetable(); };
  $('setSave').onclick = async () => {
    const name = $('setTeacher').value;
    panelsOn = [...$('modal').querySelectorAll('.chk input[type=checkbox]:checked')].map(i => i.value);
    const orient = ($('modal').querySelector('input[name=orient]:checked') || {}).value || 'landscape';
    closeSettings();
    await pywebview.api.set_panels(panelsOn); applyPanels();
    if (pywebview.api.set_orientation) await pywebview.api.set_orientation(orient);
    setOrientation(orient);
    if (name && (!tt || tt.teacher !== name)) { await pywebview.api.set_teacher(name); ttSel = null; ttWant = name; ttRetry = 0; loadTimetable(); }
  };
  $('pcMini').onclick = () => { if (window.openDetail) openDetail('pc'); };
  loadWeather(); loadEvents(); loadSystem(); loadTimetable(); loadMessages();
  setInterval(loadSystem, 2000);
  setInterval(loadMessages, 10 * 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
  setInterval(loadEvents, 10 * 60 * 1000);
  setInterval(loadTimetable, 60 * 1000);   // 사이트 변경사항(실시간 동기화) 반영
  setInterval(() => { renderEvents(); renderTimetable(); }, 30 * 1000);
  let day = new Date().getDate();           // 날짜가 바뀌면 사이트 새로 로드
  setInterval(() => { if (new Date().getDate() !== day) { day = new Date().getDate(); pywebview.api.reload_timetable(); } }, 60 * 1000);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('modal').classList.contains('on')) closeSettings(); else if (detailKind) closeDetail(); else pywebview.api.close();
});
</script>
<script src="detail.js"></script>
</body>
