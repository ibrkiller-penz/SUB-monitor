name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Launcher self-test
        continue-on-error: true
        run: |
          python -c "import launcher, time, json; L = launcher.Launchers([{'id':'edge','name':'Edge','exe':['msedge.exe'],'keys':['Microsoft Edge']},{'id':'chrome','name':'Chrome','exe':['chrome.exe'],'keys':['Google Chrome']}] + launcher.DEFAULT_LAUNCHERS, log=print); L.refresh(force=True); time.sleep(1); [time.sleep(1) for _ in range(170) if L._busy]; print(json.dumps(L.found, ensure_ascii=False, indent=1)); print([(a['id'], a['found'], len(a['icon'])) for a in L.list()])"
      - name: Build
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name SUBmonitor --icon app.ico --add-data "web;web" --collect-all webview --hidden-import notify --hidden-import tt_worker --hidden-import launcher --hidden-import kma --hidden-import bambu --hidden-import winmon --collect-submodules paho app.py
          Copy-Item config.json dist\SUBmonitor\config.json
          $ProgressPreference = 'SilentlyContinue'
          # ffmpeg 받기: gyan.dev 가 가끔 503 → 3번 재시도 후 GitHub(BtbN) 빌드로
          $ok = $false
          foreach ($u in @("https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip", "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip", "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip", "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip")) {
            try { Invoke-WebRequest $u -OutFile ff.zip -TimeoutSec 300; $ok = $true; break } catch { Write-Host "ffmpeg 받기 실패: $u"; Start-Sleep 10 }
          }
          if (-not $ok) { throw "ffmpeg 를 받지 못함" }
          Expand-Archive ff.zip -DestinationPath ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\SUBmonitor\ffmpeg.exe
          Copy-Item README.md dist\SUBmonitor\README.md
          Compress-Archive -Path dist\SUBmonitor -DestinationPath SUBmonitor-win.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SUBmonitor-win
          path: SUBmonitor-win.zip
      - name: Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드 (자동)
          body: "main 브랜치 최신 커밋에서 자동 생성된 Windows 실행 파일. 압축을 풀고 SUBmonitor.exe 실행."
          files: SUBmonitor-win.zip
          prerelease: false
