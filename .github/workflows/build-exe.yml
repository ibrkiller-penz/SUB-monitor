name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Launcher self-test
        continue-on-error: true
        run: |
          python -c "import launcher, time, json; L = launcher.Launchers([{'id':'edge','name':'Edge','exe':['msedge.exe'],'keys':['Microsoft Edge']},{'id':'chrome','name':'Chrome','exe':['chrome.exe'],'keys':['Google Chrome']}] + launcher.DEFAULT_LAUNCHERS, log=print); L.refresh(force=True); time.sleep(1); [time.sleep(1) for _ in range(170) if L._busy]; print(json.dumps(L.found, ensure_ascii=False, indent=1)); print([(a['id'], a['found'], len(a['icon'])) for a in L.list()])"
      - name: Build
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name SUBmonitor --icon app.ico --add-data "web;web" --collect-all webview --hidden-import notify --hidden-import tt_worker --hidden-import launcher app.py
          Copy-Item config.json dist\SUBmonitor\config.json
          Copy-Item README.md dist\SUBmonitor\README.md
          Compress-Archive -Path dist\SUBmonitor -DestinationPath SUBmonitor-win.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: SUBmonitor-win
          path: SUBmonitor-win.zip
      - name: Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 최신 빌드 (자동)
          body: "main 브랜치 최신 커밋에서 자동 생성된 Windows 실행 파일. 압축을 풀고 SUBmonitor.exe 실행."
          files: SUBmonitor-win.zip
          prerelease: false
